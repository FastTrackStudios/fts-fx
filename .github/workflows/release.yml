# Release: the guard on every release PR, and, from a release tag, the plugin
# installers and the GitHub Release they are attached to. The fleet release
# flow (as patchbay's); the logic is scripts/release.sh, the installers are
# the Justfile's plugins-pkg / plugins-package, so a person can run every
# step by hand.
#
#   PR into main or release/**   "Release guard" (hosted, cheap): a release
#                          PR (head `release/pending`) must be ONE commit
#                          `chore(release): vYY.M.MICRO` on the current head
#                          of its base: the version bump, the new CHANGELOG.md
#                          section and the change files it consumed. Other
#                          PRs skip it.
#   push tag v*            "Tag guard" (the tag is a release commit on main or
#                          release/v*), then in parallel:
#                            macOS    FTS-Plugins-<v>-macos.pkg: universal,
#                                     Developer ID signed, notarized, stapled
#                                     (self-hosted: the Mac with the signing
#                                     identities, as Studio's desktop.yml)
#                            Linux    fts-plugins-<v>-linux-x86_64.tar.gz (hosted)
#                          then "GitHub Release": the Release with the notes
#                          from CHANGELOG.md and every installer that built,
#                          plus SHA256SUMS. macOS and Linux must both succeed.
#                          (No Windows build for now; scripts/install.ps1 and
#                          `just plugins-package` still work there by hand.)
#   workflow_dispatch      the same, by hand, with the tag as the ref.
#
# A tag is pushed by `just release-tag` as a person or the fts-forge App: a
# tag pushed with GITHUB_TOKEN starts no workflow.
#
# SECURITY: this repo is public. The self-hosted job runs only for a v* tag
# of this repository (never for a pull request), and the guard runs the
# BASE commit's copy of scripts/release.sh, never the PR's.

name: release

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Is this release PR sound? (the base commit's script)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if ! git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"; then
            echo "::notice::the base has no scripts/release.sh: nothing to guard"
            exit 0
          fi
          bash "${RUNNER_TEMP}/release-base.sh" guard

  tag-guard:
    name: Tag guard
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'FastTrackStudios/fts-fx' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: The tag is a release commit on main or release/v*
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh tag-guard
      - name: Version
        id: v
        run: echo "version=$(bash scripts/release.sh version)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS .pkg
    needs: tag-guard
    runs-on: [self-hosted, macos, studio-release-mac]
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Preflight (build volume mounted, space free)
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "::error::/Volumes/build-disk is not mounted on this runner"; exit 1
          fi
          avail_kb="$(df -k /Volumes/build-disk | awk 'NR==2 {print $4}')"
          if [ "$avail_kb" -lt $((100 * 1024 * 1024)) ]; then
            echo "::error::under 100 GB free on /Volumes/build-disk: sweep target/ dirs first"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      # The runner's service starts with a bare PATH: v26.11.0 stopped on
      # `rustup: command not found`, v26.11.1 on `just`. Everything the job
      # calls is put on PATH and checked here, so a missing tool fails once,
      # by name, before anything is built.
      - name: The job's tools on PATH (rustup, cargo, just, jq, gh)
        run: |
          set -euo pipefail
          for dir in "$HOME/.cargo/bin" /opt/homebrew/bin "$HOME/.nix-profile/bin" \
                     /run/current-system/sw/bin /nix/var/nix/profiles/default/bin; do
            [ -d "$dir" ] && echo "$dir" >> "$GITHUB_PATH" && PATH="$dir:$PATH"
          done
          missing=""
          for tool in rustup cargo just jq gh xcrun codesign pkgbuild productbuild security lipo; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::not on this runner's PATH:$missing"; exit 1
          fi
      - name: Both Mac targets (bundle-universal builds arm64 and x86_64)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build, sign, package, notarize, staple
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          NOTARIZE: "1"
        run: |
          set -euo pipefail
          rm -rf dist target/installer
          just plugins-pkg
          just plugins-verify
          just plugins-verify x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/FTS-Plugins-*-macos*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux archive
    needs: tag-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Room to build (the hosted image ships ~14 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build dependencies (windowing, GL, audio, mold)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev mold \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl-dev libwayland-dev libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libssl-dev libfontconfig1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev libdbus-1-dev libxdo-dev
      - name: Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build and package
        run: just plugins-package
      - name: Every bundle loads
        run: just plugins-verify
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/fts-plugins-*-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: [tag-guard, macos, linux]
    if: >-
      always() &&
      needs.tag-guard.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      - name: Publish the Release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/installers
        run: bash scripts/release.sh publish
