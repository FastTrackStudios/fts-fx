# Release: the guard on every release PR, and, from a release tag, the plugin
# installers and the GitHub Release they are attached to. The fleet release
# flow (as patchbay's); the logic is scripts/release.sh, the installers are
# the Justfile's plugins-pkg / plugins-package, so a person can run every
# step by hand.
#
#   PR into main or release/**   "Release guard" (hosted, cheap): a release
#                          PR (head `release/pending`) must be ONE commit
#                          `chore(release): vYY.M.MICRO` on the current head
#                          of its base: the version bump, the new CHANGELOG.md
#                          section and the change files it consumed. Other
#                          PRs skip it.
#   push tag v*            "Tag guard" (the tag is a release commit on main or
#                          release/v*), then in parallel:
#                            macOS    FTS-Plugins-<v>-macos.pkg: universal,
#                                     Developer ID signed, notarized, stapled
#                                     (self-hosted: the Mac with the signing
#                                     identities, as Studio's desktop.yml)
#                            Linux    fts-plugins-<v>-linux-x86_64.tar.gz
#                                     (self-hosted: THEBATTLESHIP's pool)
#                          Both build inside the fleet devenv shell
#                          (devenv.nix; `devenv shell -- …`): one rustc store
#                          path, the fleet's, and on NixOS the only source of
#                          the compiler and the libraries the plugins link.
#                          then "GitHub Release": the Release with the notes
#                          from CHANGELOG.md and every installer that built,
#                          plus SHA256SUMS. macOS and Linux must both succeed.
#                          (No Windows build for now; scripts/install.ps1 and
#                          `just plugins-package` still work there by hand.)
#   workflow_dispatch      the same, by hand, with the tag as the ref.
#
# A tag is pushed by `just release-tag` as a person or the fts-forge App: a
# tag pushed with GITHUB_TOKEN starts no workflow.
#
# SECURITY: this repo is public and both build jobs are self-hosted. They run
# only for a v* tag of this repository, or a workflow_dispatch on such a tag
# by a maintainer or admin (checked in "Tag guard"), never for a pull
# request: both `needs: tag-guard`, which never runs on a pull_request event,
# and repeat its condition in their own `if:`. A fork cannot push a tag here.
# The release-PR guard is hosted and runs the BASE commit's copy of
# scripts/release.sh, never the PR's. What this file cannot stop is a fork's
# PR that edits a workflow to target the self-hosted labels itself: that is
# the org's runner-group and fork-PR-approval settings, not this YAML.

name: release

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Is this release PR sound? (the base commit's script)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if ! git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"; then
            echo "::notice::the base has no scripts/release.sh: nothing to guard"
            exit 0
          fi
          bash "${RUNNER_TEMP}/release-base.sh" guard

  tag-guard:
    name: Tag guard
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'FastTrackStudios/fts-fx' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # A dispatch starts the self-hosted jobs: GitHub only lets a person
      # with write access dispatch, and this narrows it to maintain/admin.
      - name: A dispatch is a maintainer's
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          role="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .role_name)"
          case "$role" in
            admin|maintain) echo "${ACTOR}: ${role}" ;;
            *) echo "::error::${ACTOR} is '${role}': a release dispatch needs maintain or admin"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: The tag is a release commit on main or release/v*
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh tag-guard
      - name: Version
        id: v
        run: echo "version=$(bash scripts/release.sh version)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS .pkg
    needs: tag-guard
    if: >-
      needs.tag-guard.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.repository == 'FastTrackStudios/fts-fx' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macos, studio-release-mac]
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.tag-guard.outputs.version }}
      # The recipes read target/bundled: never a host-wide target dir.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Preflight (build volume mounted, space free)
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "::error::/Volumes/build-disk is not mounted on this runner"; exit 1
          fi
          avail_kb="$(df -k /Volumes/build-disk | awk 'NR==2 {print $4}')"
          if [ "$avail_kb" -lt $((100 * 1024 * 1024)) ]; then
            echo "::error::under 100 GB free on /Volumes/build-disk: sweep target/ dirs first"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: devenv CLI
        uses: ./.github/actions/devenv
      # Everything the job calls comes from the devenv shell (the fleet
      # toolchain with both Mac targets, just, lipo) or /usr/bin (codesign,
      # security, pkgbuild, productbuild, xcrun; scripts/macos/ put /usr/bin
      # first and drop the nix SDK's DEVELOPER_DIR/SDKROOT for those). Checked
      # here, so a missing tool fails once, by name, before anything builds.
      - name: The shell's toolchain and tools
        run: |
          devenv shell -- bash -euo pipefail -s <<'EOF'
          fleet-doctor
          sysroot="$(rustc --print sysroot)"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            [ -d "$sysroot/lib/rustlib/$t/lib" ] || { echo "::error::the shell's rustc has no $t"; exit 1; }
          done
          missing=""
          for tool in cargo just lipo cc; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
          for tool in codesign security pkgbuild productbuild xcrun; do
            [ -x "/usr/bin/$tool" ] || missing="$missing /usr/bin/$tool"
          done
          # pkgutil and spctl live in /usr/sbin (scripts/macos/ have it on PATH).
          for tool in pkgutil spctl; do
            [ -x "/usr/sbin/$tool" ] || missing="$missing /usr/sbin/$tool"
          done
          [ -z "$missing" ] || { echo "::error::missing:$missing"; exit 1; }
          env -u DEVELOPER_DIR -u SDKROOT /usr/bin/xcrun --find notarytool
          EOF
      - name: Build, sign, package, notarize, staple
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          NOTARIZE: "1"
        run: |
          devenv shell -- bash -euo pipefail -s <<'EOF'
          rm -rf dist target/installer
          just plugins-pkg
          just plugins-verify
          just plugins-verify x86_64
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/FTS-Plugins-*-macos*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux archive
    needs: tag-guard
    if: >-
      needs.tag-guard.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.repository == 'FastTrackStudios/fts-fx' &&
      startsWith(github.ref, 'refs/tags/v')
    # THEBATTLESHIP's shared pool (NixOS, Studio's checks.yml label). No apt
    # there: the compiler, mold, just and every library the plugins link come
    # from the devenv shell (devenv.nix). kache is the host's RUSTC_WRAPPER.
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.tag-guard.outputs.version }}
      # The recipes read target/bundled: never a host-wide target dir.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: devenv CLI
        uses: ./.github/actions/devenv
      - name: The shell's toolchain
        run: devenv shell -- fleet-doctor
      - name: Build and package
        run: devenv shell -- just plugins-package
      - name: Every bundle loads
        run: devenv shell -- just plugins-verify
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/fts-plugins-*-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: [tag-guard, macos, linux]
    if: >-
      always() &&
      needs.tag-guard.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      - name: Publish the Release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/installers
        run: bash scripts/release.sh publish
