[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"
[profile.dev-dbg.package."*"]
debug = 2

[profile.release-fast]
inherits = "release"
incremental = true
codegen-units = 256

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
